<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    {% seo %}
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved) document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="masthead-row">
          <a class="site-name" href="{{ "/" | relative_url }}">{{ site.title }}</a>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
        </div>
        <nav class="site-nav" aria-label="Primary navigation">
          {% for item in site.nav %}
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
          {% endfor %}
        </nav>
        <hr class="site-rule">
      </header>

      <main class="site-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <hr>
        <span>© {{ "now" | date: "%Y" }} {{ site.author.name }}</span>
        <span class="footer-sep">·</span>
        <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
      </footer>
    </div>

    <script>
      (function () {
        var button = document.querySelector(".theme-toggle");
        if (!button) return;

        function prefersDark() {
          var explicit = document.documentElement.dataset.theme;
          if (explicit) return explicit === "dark";
          return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        function render() {
          button.textContent = prefersDark() ? "☀" : "☾";
        }

        button.addEventListener("click", function () {
          var next = prefersDark() ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem("theme", next); } catch (e) {}
          render();
        });

        render();
      })();
    </script>
  </body>
</html>
