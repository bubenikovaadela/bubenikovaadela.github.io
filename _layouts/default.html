<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    {% seo %}
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved) document.documentElement.dataset.theme = saved;
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="{{ "/assets/css/site.css" | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <div class="header-row">
          <div class="brand">
            <a class="title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
            <nav class="nav" aria-label="Primary navigation">
              {% for item in site.nav %}
                <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
              {% endfor %}
            </nav>
          </div>
          <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
        </div>
        <hr class="header-rule">
      </div>
    </header>

    <main class="wrap content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <hr class="footer-rule">
        <div class="footer-line">
          © {{ "now" | date: "%Y" }} {{ site.author.name }} ·
          <a href="{{ "/feed.xml" | relative_url }}">RSS</a>
        </div>
      </div>
    </footer>

    <script>
      (function () {
        var button = document.querySelector(".theme-toggle");
        if (!button) return;

        function currentTheme() {
          var explicit = document.documentElement.dataset.theme;
          if (explicit) return explicit;
          return window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }

        function updateIcon() {
          button.textContent = currentTheme() === "dark" ? "☀" : "☾";
        }

        button.addEventListener("click", function () {
          var next = currentTheme() === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem("theme", next); } catch (e) {}
          updateIcon();
        });

        updateIcon();
      })();
    </script>
  </body>
</html>
