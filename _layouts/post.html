---
layout: default
---
<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    {% if page.date %}<span>{{ page.date | date: "%Y-%m-%d" }}</span>{% endif %}
    {% if page.categories %}<span class="sep">·</span><span>{{ page.categories | join: ", " }}</span>{% endif %}
  </div>
  <div class="post-body">
    {{ content }}
  </div>
</article>
