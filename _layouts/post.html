---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="post-subtitle">{{ page.subtitle }}</p>
    {% endif %}
    <div class="post-meta">
      {% if page.date %}<span>{{ page.date | date: "%B %-d, %Y" }}</span>{% endif %}
      {% if page.categories and page.categories != empty %}
        <span class="sep">·</span><span>{{ page.categories | join: ", " }}</span>
      {% endif %}
    </div>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
