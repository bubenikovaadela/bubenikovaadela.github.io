---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="post-back"><a href="{{ "/blog/" | relative_url }}">← Writing</a></p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    <p class="post-date">{{ page.date | date: "%B %-d, %Y" }}</p>
  </header>

  <div class="post-body">
    {{ content }}
  </div>
</article>
