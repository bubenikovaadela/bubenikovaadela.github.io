title: "Adela Bubenikova"
tagline: "Neuroscience and essays"
description: "Neuroscience and essays—asking how brains become lives."
url: "https://bubenikovaadela.github.io"

author:
  name: "Adela Bubenikova"

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

nav:
  - title: "Home"
    url: "/"
  - title: "Blog"
    url: "/blog/"
  - title: "Research"
    url: "/research/"
  - title: "Publications"
    url: "/publications/"
  - title: "Contact"
    url: "/contact/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
