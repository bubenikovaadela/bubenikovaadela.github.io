title: "Adela Bubenikova"
tagline: "Neuroscience, writing, photography"
description: "Neuroscience, essays, and photography—asking how brains become lives."
url: "https://bubenikovaadela.github.io"

author:
  name: "Adela Bubenikova"

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

nav:
  - title: "Home"
    url: "/"
  - title: "Blog"
    url: "/blog/"
  - title: "Research"
    url: "/research/"
  - title: "Publications"
    url: "/publications/"
  - title: "Writing"
    url: "/writing/"
  - title: "Photography"
    url: "/photography/"
  - title: "Contact"
    url: "/contact/"

collections:
  photo_essays:
    output: true
    permalink: /photos/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "photo_essays"
    values:
      layout: "post"
