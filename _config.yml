title: "Adela Bubenikova"
description: "Neuroscience, neurosurgery, research and essays."
url: "https://bubenikovaadela.github.io"

locale: "en_GB"

author:
  name: "Adela Bubenikova"

markdown: kramdown

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:year/:month/:day/:title/

nav:
  - title: "Essays"
    url: "/blog/"
  - title: "Research"
    url: "/research/"
  - title: "Publications"
    url: "/publications/"
  - title: "Contact"
    url: "/contact/"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
